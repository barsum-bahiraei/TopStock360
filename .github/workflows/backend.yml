name: Publish backend

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror infrastructure images to GHCR
        run: |
          docker pull postgres:17-alpine
          docker tag postgres:17-alpine ghcr.io/${{ github.repository_owner }}/topstock360-postgres:17-alpine
          docker push ghcr.io/${{ github.repository_owner }}/topstock360-postgres:17-alpine

          docker pull minio/minio:RELEASE.2025-04-22T22-12-26Z
          docker tag minio/minio:RELEASE.2025-04-22T22-12-26Z ghcr.io/${{ github.repository_owner }}/topstock360-minio:RELEASE.2025-04-22T22-12-26Z
          docker push ghcr.io/${{ github.repository_owner }}/topstock360-minio:RELEASE.2025-04-22T22-12-26Z

  publish:
    needs: infrastructure
    uses: ./.github/workflows/_publish.yml
    with:
      service: backend
      context: Backend
      image: topstock360-backend
      image-tag-variable: BACKEND_IMAGE_TAG
    secrets: inherit
